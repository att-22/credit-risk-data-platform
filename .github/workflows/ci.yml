# Integración continua (CI): GitHub ejecuta este flujo en sus servidores
# cada vez que se sube código, para comprobar que nada se ha roto.
name: CI

# ¿CUÁNDO se ejecuta?
on:
  push:
    branches: [main]      # al subir commits a main
  pull_request:           # al abrir o actualizar una pull request
  workflow_dispatch:      # a mano, con un botón en la pestaña Actions

# ¿QUÉ se ejecuta? Varios trabajos (jobs) independientes que corren en paralelo.
jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest            # máquina virtual Linux nueva y vacía
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7

      - name: Revisar errores con ruff
        run: uv run --locked ruff check .

      - name: Comprobar el formato con ruff
        run: uv run --locked ruff format --check .

  test:
    name: Tests (${{ matrix.os }})
    # Matriz: el mismo job se ejecuta una vez por cada sistema operativo.
    strategy:
      fail-fast: false                # si falla uno, que el otro termine igualmente
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true          # reutiliza las librerías descargadas entre ejecuciones

      - name: Instalar Python y las dependencias
        run: uv sync --locked         # --locked: falla si uv.lock no está al día

      - name: Ejecutar los tests
        run: uv run pytest

  dbt:
    name: dbt build (muestra)
    runs-on: ubuntu-latest
    # Los datos reales no están en GitHub: el pipeline completo se ejecuta sobre
    # la muestra de tests/fixtures/muestra (ver scripts/crear_muestra.py).
    env:
      DATA_DIR: ${{ github.workspace }}/tests/fixtures/muestra
      LAKE_DIR: ${{ github.workspace }}/lake
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Instalar Python y las dependencias
        run: uv sync --locked

      - name: Verificar los datos de entrada
        run: uv run verify-data

      - name: Simular las entregas diarias del sistema origen (landing zone)
        run: uv run simulate-source

      - name: Ingesta incremental a la capa bronze
        run: uv run ingest-bronze

      - name: Instalar los paquetes de dbt
        working-directory: transform
        run: uv run dbt deps

      - name: Construir y testear los modelos (staging, intermediate, marts)
        working-directory: transform
        run: uv run dbt build

      - name: Comprobar la frescura de las fuentes
        working-directory: transform
        run: uv run dbt source freshness

      # Carga incremental en tandas + una entrega tardía, y comparación con una
      # reconstrucción completa: los modelos incrementales deben dar lo mismo.
      - name: Paridad de la carga incremental con la reconstrucción completa
        run: uv run python scripts/comprobar_paridad_incremental.py

  streaming:
    name: Streaming (Redpanda)
    runs-on: ubuntu-latest
    # Tests de integración del productor y el consumidor contra un broker real.
    # (Los "services" de GitHub Actions no permiten pasar argumentos al
    # contenedor, y Redpanda los necesita: se arranca con docker run.)
    env:
      KAFKA_BOOTSTRAP_TEST: localhost:19092
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v5

      - name: Arrancar Redpanda
        run: >
          docker run -d --name redpanda -p 19092:19092 redpandadata/redpanda:v26.2.4
          redpanda start --mode dev-container --smp 1 --memory 1G
          --kafka-addr 0.0.0.0:19092 --advertise-kafka-addr localhost:19092

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Instalar Python y las dependencias
        run: uv sync --locked

      - name: Esperar a que Redpanda esté listo
        run: |
          for i in $(seq 1 30); do
            docker exec redpanda rpk cluster health | grep -qE 'Healthy:.+true' && exit 0
            sleep 2
          done
          exit 1

      - name: Tests de streaming (productor, consumidor, DLQ, caídas)
        run: uv run pytest tests/test_streaming.py

  cdc:
    name: CDC (Postgres + Debezium)
    runs-on: ubuntu-latest
    # Captura de cambios de punta a punta: Postgres -> Debezium -> Redpanda ->
    # bronze -> dbt, comparando la réplica con la tabla real de Postgres.
    env:
      DATA_DIR: ${{ github.workspace }}/tests/fixtures/muestra
      LAKE_DIR: ${{ github.workspace }}/lake
      KAFKA_BOOTSTRAP_TEST: localhost:19092
      CORE_DSN_TEST: postgresql://banco:banco@localhost:5433/core
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v5

      - name: Arrancar Redpanda, el core bancario y Debezium (de compose.yaml)
        run: docker compose up -d --wait redpanda core-bancario && docker compose up -d debezium

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Instalar Python y las dependencias
        run: uv sync --locked

      - name: Tests de CDC (incluida la captura real de Postgres)
        run: uv run pytest tests/test_cdc.py

      - name: Simular un día de cambios en el core bancario
        run: |
          uv run simulate-source --destino lake/origen/muestra
          uv run simulate-core --fecha 2026-09-03 --conjunto muestra

      - name: Instalar los paquetes de dbt
        working-directory: transform
        run: uv run dbt deps

      - name: Réplica del CDC idéntica a Postgres e historial completo
        run: uv run python scripts/comprobar_replica_cdc.py

  airflow:
    name: Airflow DAGs
    runs-on: ubuntu-latest
    # Los tests del DAG necesitan Airflow y Cosmos: se ejecutan dentro de la
    # misma imagen que usa compose.yaml, no en el entorno del proyecto.
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v5

      - name: Construir la imagen de Airflow
        run: docker build -f orchestration/Dockerfile -t credit-risk-airflow:ci .

      - name: Tests de integridad del DAG
        run: >
          docker run --rm
          -v "${{ github.workspace }}/orchestration/dags:/opt/airflow/dags:ro"
          -v "${{ github.workspace }}/orchestration/tests:/opt/airflow/tests:ro"
          credit-risk-airflow:ci
          bash -c "pip install --quiet --no-cache-dir pytest==9.1.1
          && python -m pytest /opt/airflow/tests -v -p no:cacheprovider"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v5

      - name: Construir la imagen
        run: docker build -t credit-risk .

      - name: Comprobar que el paquete funciona dentro de la imagen (prueba de humo)
        run: docker run --rm credit-risk python -c "import credit_risk.verify_data; print('OK')"
