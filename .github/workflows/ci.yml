# Integración continua (CI): GitHub ejecuta este flujo en sus servidores
# cada vez que se sube código, para comprobar que nada se ha roto.
name: CI

# ¿CUÁNDO se ejecuta?
on:
  push:
    branches: [main]      # al subir commits a main
  pull_request:           # al abrir o actualizar una pull request
  workflow_dispatch:      # a mano, con un botón en la pestaña Actions

# ¿QUÉ se ejecuta? Varios trabajos (jobs) independientes que corren en paralelo.
jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest            # máquina virtual Linux nueva y vacía
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7

      - name: Revisar errores con ruff
        run: uv run --locked ruff check .

      - name: Comprobar el formato con ruff
        run: uv run --locked ruff format --check .

  test:
    name: Tests (${{ matrix.os }})
    # Matriz: el mismo job se ejecuta una vez por cada sistema operativo.
    strategy:
      fail-fast: false                # si falla uno, que el otro termine igualmente
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true          # reutiliza las librerías descargadas entre ejecuciones

      - name: Instalar Python y las dependencias
        run: uv sync --locked         # --locked: falla si uv.lock no está al día

      - name: Ejecutar los tests
        run: uv run pytest

  dbt:
    name: dbt build (muestra)
    runs-on: ubuntu-latest
    # Los datos reales no están en GitHub: el pipeline completo se ejecuta sobre
    # la muestra de tests/fixtures/muestra (ver scripts/crear_muestra.py).
    env:
      DATA_DIR: ${{ github.workspace }}/tests/fixtures/muestra
      LAKE_DIR: ${{ github.workspace }}/lake
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Instalar Python y las dependencias
        run: uv sync --locked

      - name: Verificar los datos de entrada
        run: uv run verify-data

      - name: Ingesta a la capa bronze
        run: uv run ingest-bronze

      - name: Instalar los paquetes de dbt
        working-directory: transform
        run: uv run dbt deps

      - name: Construir y testear los modelos (staging, intermediate, marts)
        working-directory: transform
        run: uv run dbt build

      - name: Comprobar la frescura de las fuentes
        working-directory: transform
        run: uv run dbt source freshness

  airflow:
    name: Airflow DAGs
    runs-on: ubuntu-latest
    # Los tests del DAG necesitan Airflow y Cosmos: se ejecutan dentro de la
    # misma imagen que usa compose.yaml, no en el entorno del proyecto.
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v5

      - name: Construir la imagen de Airflow
        run: docker build -f orchestration/Dockerfile -t credit-risk-airflow:ci .

      - name: Tests de integridad del DAG
        run: >
          docker run --rm
          -v "${{ github.workspace }}/orchestration/dags:/opt/airflow/dags:ro"
          -v "${{ github.workspace }}/orchestration/tests:/opt/airflow/tests:ro"
          credit-risk-airflow:ci
          bash -c "pip install --quiet --no-cache-dir pytest==9.1.1
          && python -m pytest /opt/airflow/tests -v -p no:cacheprovider"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v5

      - name: Construir la imagen
        run: docker build -t credit-risk .

      - name: Comprobar que el paquete funciona dentro de la imagen (prueba de humo)
        run: docker run --rm credit-risk python -c "import credit_risk.verify_data; print('OK')"
