# Integración continua (CI): GitHub ejecuta este flujo en sus servidores
# cada vez que se sube código, para comprobar que nada se ha roto.
name: CI

# ¿CUÁNDO se ejecuta?
on:
  push:
    branches: [main]      # al subir commits a main
  pull_request:           # al abrir o actualizar una pull request
  workflow_dispatch:      # a mano, con un botón en la pestaña Actions

# ¿QUÉ se ejecuta? Varios trabajos (jobs) independientes que corren en paralelo.
jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest            # máquina virtual Linux nueva y vacía
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7

      - name: Revisar errores con ruff
        run: uv run --locked ruff check .

      - name: Comprobar el formato con ruff
        run: uv run --locked ruff format --check .

  test:
    name: Tests (${{ matrix.os }})
    # Matriz: el mismo job se ejecuta una vez por cada sistema operativo.
    strategy:
      fail-fast: false                # si falla uno, que el otro termine igualmente
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true          # reutiliza las librerías descargadas entre ejecuciones

      - name: Instalar Python y las dependencias
        run: uv sync --locked         # --locked: falla si uv.lock no está al día

      - name: Ejecutar los tests
        run: uv run pytest

  dbt:
    name: dbt build (muestra)
    runs-on: ubuntu-latest
    # Los datos reales no están en GitHub: el pipeline completo se ejecuta sobre
    # la muestra de tests/fixtures/muestra (ver scripts/crear_muestra.py).
    env:
      DATA_DIR: ${{ github.workspace }}/tests/fixtures/muestra
      LAKE_DIR: ${{ github.workspace }}/lake
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Instalar Python y las dependencias
        run: uv sync --locked

      - name: Verificar los datos de entrada
        run: uv run verify-data

      - name: Simular las entregas diarias del sistema origen (landing zone)
        run: uv run simulate-source

      - name: Ingesta incremental a la capa bronze
        run: uv run ingest-bronze

      - name: Instalar los paquetes de dbt
        working-directory: transform
        run: uv run dbt deps

      - name: Construir y testear los modelos (staging, intermediate, marts)
        working-directory: transform
        run: uv run dbt build

      - name: Comprobar la frescura de las fuentes
        working-directory: transform
        run: uv run dbt source freshness

      # Carga incremental en tandas + una entrega tardía, y comparación con una
      # reconstrucción completa: los modelos incrementales deben dar lo mismo.
      - name: Paridad de la carga incremental con la reconstrucción completa
        run: uv run python scripts/comprobar_paridad_incremental.py

  streaming:
    name: Streaming (Redpanda)
    runs-on: ubuntu-latest
    # Tests de integración del productor y el consumidor contra un broker real.
    # (Los "services" de GitHub Actions no permiten pasar argumentos al
    # contenedor, y Redpanda los necesita: se arranca con docker run.)
    env:
      KAFKA_BOOTSTRAP_TEST: localhost:19092
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v5

      - name: Arrancar Redpanda
        run: >
          docker run -d --name redpanda -p 19092:19092 redpandadata/redpanda:v26.2.4
          redpanda start --mode dev-container --smp 1 --memory 1G
          --kafka-addr 0.0.0.0:19092 --advertise-kafka-addr localhost:19092

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Instalar Python y las dependencias
        run: uv sync --locked

      - name: Esperar a que Redpanda esté listo
        run: |
          for i in $(seq 1 30); do
            docker exec redpanda rpk cluster health | grep -qE 'Healthy:.+true' && exit 0
            sleep 2
          done
          exit 1

      - name: Tests de streaming (productor, consumidor, DLQ, caídas)
        run: uv run pytest tests/test_streaming.py

  cdc:
    name: CDC (Postgres + Debezium)
    runs-on: ubuntu-latest
    # Captura de cambios de punta a punta: Postgres -> Debezium -> Redpanda ->
    # bronze -> dbt, comparando la réplica con la tabla real de Postgres.
    env:
      DATA_DIR: ${{ github.workspace }}/tests/fixtures/muestra
      LAKE_DIR: ${{ github.workspace }}/lake
      KAFKA_BOOTSTRAP_TEST: localhost:19092
      CORE_DSN_TEST: postgresql://banco:banco@localhost:5433/core
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v5

      - name: Arrancar Redpanda, el core bancario y Debezium (de compose.yaml)
        run: docker compose up -d --wait redpanda core-bancario && docker compose up -d debezium

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Instalar Python y las dependencias
        run: uv sync --locked

      - name: Tests de CDC (incluida la captura real de Postgres)
        run: uv run pytest tests/test_cdc.py

      - name: Simular un día de cambios en el core bancario
        run: |
          uv run simulate-source --destino lake/origen/muestra
          uv run simulate-core --fecha 2026-09-03 --conjunto muestra

      - name: Instalar los paquetes de dbt
        working-directory: transform
        run: uv run dbt deps

      - name: Réplica del CDC idéntica a Postgres e historial completo
        run: uv run python scripts/comprobar_replica_cdc.py

  spark:
    name: Spark
    runs-on: ubuntu-latest
    # Tests de los trabajos de PySpark y Delta Lake y paridad con dbt sobre la
    # muestra. Spark necesita Java: se instala la 17 (la misma que la imagen de
    # Spark). Los jars de Delta se descargan de Maven al crear la sesión.
    env:
      DATA_DIR: ${{ github.workspace }}/tests/fixtures/muestra
      LAKE_DIR: ${{ github.workspace }}/lake
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v5

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Instalar Python y las dependencias (con el grupo spark)
        run: uv sync --locked --group spark

      - name: Tests de los trabajos de Spark
        run: uv run pytest tests/spark

      - name: Construir bronze y los modelos de dbt equivalentes
        run: |
          uv run simulate-source
          uv run ingest-bronze
          cd transform
          uv run dbt deps
          uv run dbt build --select +int_bureau_balance__por_credito +int_installments_payments__por_cliente --indirect-selection cautious

      - name: Ejecutar los trabajos de Spark (Parquet y Delta) y comparar con dbt
        run: |
          uv run python spark_jobs/agregados.py --lake lake
          uv run python spark_jobs/delta_lake.py cargar --lake lake
          uv run python spark_jobs/delta_lake.py historia --lake lake
          uv run python scripts/comprobar_paridad_spark.py --delta

      - name: Notebook de Databricks en modo local (se comprueba a sí mismo)
        run: uv run python spark_jobs/databricks_demo.py

  terraform:
    name: Terraform (AWS emulado)
    runs-on: ubuntu-latest
    # La infraestructura como código se prueba igual que el resto. Contra Moto (AWS
    # emulado) se ensayan los mismos pasos que hace el despliegue real (deploy.yml):
    # bootstrap, estado remoto en S3, plan guardado y apply de ese plan; y se
    # comprueba con boto3 que los recursos son los declarados.
    env:
      DATA_DIR: ${{ github.workspace }}/tests/fixtures/muestra  # compose.yaml la exige
      TF: docker compose --profile aws run --rm -T terraform
      VARS: -input=false -no-color -var-file=entornos/local.tfvars
      MOTO: -input=false -no-color -var endpoint_aws=http://moto:5000
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v5

      - name: Arrancar Moto (de compose.yaml)
        run: docker compose --profile aws up -d moto

      - name: Formato
        run: $TF fmt -check -recursive -diff

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: "Bootstrap: bucket del estado, proveedor OIDC y rol de despliegue"
        run: |
          $TF -chdir=bootstrap init -input=false -lockfile=readonly
          $TF -chdir=bootstrap validate -no-color
          $TF -chdir=bootstrap apply $MOTO -auto-approve
          $TF -chdir=bootstrap apply $MOTO -auto-approve
          $TF -chdir=bootstrap plan $MOTO -detailed-exitcode
          uv run --locked --group aws python scripts/comprobar_infra.py --bootstrap

      - name: Estado remoto en el bucket del bootstrap
        run: |
          sh infra/backend.sh "$($TF -chdir=bootstrap output -raw bucket_estado 2>/dev/null)" local http://moto:5000
          $TF init -input=false -lockfile=readonly
          $TF validate -no-color

      - name: Desplegar en Moto el plan guardado
        # Dos veces: Moto ignora las etiquetas que el proveedor manda al crear el
        # bucket y la segunda las aplica (en AWS real basta con una)
        run: |
          for vuelta in 1 2; do
            $TF plan $VARS -out=despliegue.tfplan
            $TF apply -input=false -no-color despliegue.tfplan
          done

      - name: Sin cambios pendientes (idempotencia)
        run: $TF plan $VARS -detailed-exitcode

      - name: Comprobar los recursos con boto3
        run: uv run --locked --group aws python scripts/comprobar_infra.py

      - name: Destruir
        run: $TF destroy $VARS -auto-approve

  lago-s3:
    name: Lago en S3 (AWS emulado)
    runs-on: ubuntu-latest
    # El pipeline con el lago en S3: Terraform crea el bucket en Moto y después la
    # landing y bronze viven en él. Se exige el mismo resultado que en disco.
    env:
      DATA_DIR: ${{ github.workspace }}/tests/fixtures/muestra
      TF: docker compose --profile aws run --rm -T terraform
      # Credenciales de mentira para Moto (con AWS real vendrían de OIDC)
      AWS_ENDPOINT_URL: http://localhost:5000
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: eu-west-1
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v5

      - name: Crear la infraestructura en Moto con Terraform
        run: |
          docker compose --profile aws up -d moto
          $TF init -input=false -lockfile=readonly
          $TF apply -input=false -no-color -auto-approve -var-file=entornos/local.tfvars
          echo "LAGO=$($TF output -raw uri_lago 2>/dev/null)" >> "$GITHUB_ENV"

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Instalar Python y las dependencias
        run: uv sync --locked

      - name: Tests del acceso al lago, también contra S3
        run: LAGO_S3_TEST=$LAGO uv run pytest tests/test_lago.py

      - name: Instalar los paquetes de dbt
        working-directory: transform
        run: uv run dbt deps

      - name: Mismo bronze y mismo mart con el lago en S3 que en disco
        run: uv run python scripts/comprobar_paridad_s3.py --lago "$LAGO"

      - name: Paridad de la carga incremental con el lago en S3
        env:
          DBT_TARGET: s3
        run: |
          export LAKE_URI=$LAGO LAKE_DIR=${{ github.workspace }}/lake
          mkdir -p "$LAKE_DIR"
          uv run simulate-source
          uv run python scripts/comprobar_paridad_incremental.py
      # Sin destroy: el runner se descarta, y Moto falla al vaciar un bucket
      # versionado con objetos borrados (ver infra/README.md)

  modelo:
    name: Modelo
    runs-on: ubuntu-latest
    # El final del camino: del mart al modelo y a las puntuaciones. Tests y una
    # ejecución real sobre la muestra (rápida: los datos son sintéticos, así que
    # se comprueba que todo funciona, no la calidad del modelo).
    env:
      DATA_DIR: ${{ github.workspace }}/tests/fixtures/muestra
      LAKE_DIR: ${{ github.workspace }}/lake
      OUTPUTS_DIR: ${{ github.workspace }}/outputs
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Instalar Python y las dependencias (con el grupo ml)
        run: uv sync --locked --group ml

      - name: Tests del entrenamiento y de la puntuación
        run: uv run pytest tests/test_modelo.py tests/test_scoring.py

      - name: Construir el mart sobre la muestra
        run: |
          uv run simulate-source
          uv run ingest-bronze
          cd transform
          uv run dbt deps
          uv run dbt build --select +mart_scoring__clientes --exclude test_type:data

      - name: Entrenar sobre el mart y publicar el modelo
        run: |
          uv run train-model --prueba
          cat outputs/modelos/vigente/metricas.json
          test -s outputs/modelos/vigente/modelo.txt

      - name: Puntuar con el modelo publicado las solicitudes sin resolver
        run: |
          uv run score
          ls lake/warehouse/scoring/modelo=*/data.parquet

  airflow:
    name: Airflow DAGs
    runs-on: ubuntu-latest
    # Los tests del DAG necesitan Airflow y Cosmos: se ejecutan dentro de la
    # misma imagen que usa compose.yaml, no en el entorno del proyecto.
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v5

      - name: Construir la imagen de Airflow
        run: docker build -f orchestration/Dockerfile -t credit-risk-airflow:ci .

      - name: Tests de integridad del DAG
        run: >
          docker run --rm
          -v "${{ github.workspace }}/orchestration/dags:/opt/airflow/dags:ro"
          -v "${{ github.workspace }}/orchestration/tests:/opt/airflow/tests:ro"
          credit-risk-airflow:ci
          bash -c "pip install --quiet --no-cache-dir pytest==9.1.1
          && python -m pytest /opt/airflow/tests -v -p no:cacheprovider"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v5

      - name: Construir la imagen
        run: docker build -t credit-risk .

      - name: Comprobar que el paquete funciona dentro de la imagen (prueba de humo)
        run: docker run --rm credit-risk python -c "import credit_risk.verify_data; print('OK')"
