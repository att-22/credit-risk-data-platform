# ==========================================================================
# Debezium Server: CDC de Postgres (core bancario) -> Redpanda
# ==========================================================================
# Debezium lee el WAL (registro de transacciones) de Postgres mediante
# replicación lógica y publica un evento por cada INSERT, UPDATE o DELETE.
# Debezium Server es la versión independiente: no necesita Kafka Connect.

# --- Destino: Redpanda (API de Kafka) ---
debezium.sink.type=kafka
debezium.sink.kafka.producer.bootstrap.servers=redpanda:9092
debezium.sink.kafka.producer.key.serializer=org.apache.kafka.common.serialization.StringSerializer
debezium.sink.kafka.producer.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# --- Origen: Postgres ---
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.database.hostname=core-bancario
debezium.source.database.port=5432
debezium.source.database.user=debezium
debezium.source.database.password=debezium
debezium.source.database.dbname=core
# pgoutput: el plugin de replicación lógica que trae Postgres de serie
debezium.source.plugin.name=pgoutput
debezium.source.publication.name=cdc_core
debezium.source.publication.autocreate.mode=disabled
debezium.source.slot.name=debezium_core
debezium.source.table.include.list=core.solicitudes
# Topic = <prefijo>.<esquema>.<tabla> -> cdc.core.solicitudes
debezium.source.topic.prefix=cdc
# Al arrancar por primera vez, lee la tabla entera (snapshot, op="r") y después
# sigue con los cambios. Así el destino empieza con el estado completo.
debezium.source.snapshot.mode=initial
# Hasta dónde ha leído del WAL: si se reinicia, continúa ahí (como los offsets de Kafka)
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=1000

# --- Formato de los mensajes: JSON sin el esquema embebido ---
debezium.format.key=json
debezium.format.value=json
debezium.format.key.schemas.enable=false
debezium.format.value.schemas.enable=false
# NUMERIC como texto exacto (por defecto llegaría como bytes en base64)
debezium.source.decimal.handling.mode=string
# Fechas con zona horaria en formato ISO-8601
debezium.source.time.precision.mode=connect
