# ==========================================================================
# pyproject.toml — la "ficha" del proyecto Python (estándar PEP 621)
# Sustituye a requirements.txt + setup.py en un único archivo.
# ==========================================================================

[project]
name = "credit-risk"
version = "0.1.0"
description = "Plataforma de datos para scoring crediticio (Home Credit Default Risk)"
readme = "README.md"
authors = [{ name = "Adrià Tadeo Tormos" }]
requires-python = ">=3.13"
# Librerías que el código necesita para FUNCIONAR. Se rellenan con `uv add`.
dependencies = [
    "confluent-kafka>=2.16.0",
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.6",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

# Comandos de terminal que instala el paquete: `nombre = "modulo:funcion"`.
[project.scripts]
verify-data = "credit_risk.verify_data:main"
ingest-bronze = "credit_risk.ingest:main"
simulate-source = "credit_risk.simulate_source:main"
extract-api = "credit_risk.extract_api:main"
produce-events = "credit_risk.productor:main"
consume-events = "credit_risk.consumidor:main"

# Cómo convertir el código en un paquete instalable.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

# Configuración de pytest: dónde buscar los tests y opciones por defecto.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

# Configuración de ruff (linter + formateador).
[tool.ruff]
line-length = 100           # longitud máxima de línea
target-version = "py313"    # versión de Python del proyecto

[tool.ruff.lint]
select = [
    "E",   # pycodestyle: errores de estilo (PEP 8)
    "F",   # pyflakes: errores reales (variables sin usar, imports que faltan...)
    "I",   # isort: orden de los imports
    "B",   # flake8-bugbear: patrones que suelen ser bugs
    "UP",  # pyupgrade: sintaxis moderna de Python
]
