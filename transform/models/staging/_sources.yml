version: 2

# Fuentes: los datos que dbt NO crea, sino que lee. Aquí, los Parquet de bronze.
sources:
  - name: bronze
    description: "Copia fiel de las entregas diarias de Home Credit en Parquet (ver ingest.py)."
    config:
      # dbt-duckdb: cada tabla ({name}) se lee de todas sus particiones diarias,
      # bronze/<tabla>/fecha_entrega=AAAA-MM-DD/data.parquet. hive_partitioning
      # convierte la carpeta en la columna fecha_entrega (DATE). El lago puede
      # estar en S3 (LAKE_URI=s3://..., con el target s3 de profiles.yml).
      external_location: >-
        read_parquet('{{ env_var('LAKE_URI', env_var('LAKE_DIR', '../lake')) }}/bronze/{name}/*/*.parquet',
        hive_partitioning = true)
      # Frescura: `dbt source freshness` mira el valor máximo de esta columna
      # (la escribe ingest.py) y avisa si la última ingesta es demasiado antigua.
      loaded_at_field: _INGESTED_AT
      freshness:
        warn_after: {count: 7, period: day}
        error_after: {count: 30, period: day}
    tables:
      - name: application_train
        description: "Solicitudes actuales con la variable objetivo TARGET."
      - name: application_test
        description: "Solicitudes actuales sin TARGET (para predecir)."
      - name: bureau
        description: "Créditos previos del cliente en otras entidades."
      - name: bureau_balance
        description: "Estado mensual de los créditos de bureau."
      - name: previous_application
        description: "Solicitudes anteriores del cliente en Home Credit."
      - name: pos_cash_balance
        description: "Estado mensual de créditos al consumo anteriores."
      - name: installments_payments
        description: "Pagos de cuotas de créditos anteriores."
      - name: credit_card_balance
        description: "Estado mensual de tarjetas de crédito anteriores."
