# ==========================================================================
# dbt_project.yml — configuración del proyecto dbt
# ==========================================================================
name: credit_risk
version: "1.0.0"

# Qué conexión usar (definida en profiles.yml).
profile: credit_risk

# Dónde está cada tipo de archivo (son los valores por defecto).
model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]

# Carpetas que genera dbt al ejecutarse (no se versionan).
clean-targets: ["target", "dbt_packages"]

# Configuración por carpeta: cada capa se materializa de una forma distinta.
models:
  credit_risk:
    staging:
      +materialized: view   # vista: no copia datos, se calcula al consultarla
    intermediate:
      +materialized: table  # tabla: las agregaciones son costosas, se calculan una vez
    marts:
      +materialized: table  # tabla: es lo que consultan los usuarios y el modelo de ML

# Variables del proyecto: se leen en los modelos con var() y se pueden cambiar
# al ejecutar, p. ej. dbt build --vars '{tope_ingresos: 1000000}'
vars:
  # Tope de AMT_INCOME_TOTAL: percentil 99,9 de train (igual que el TFM), congelado
  # para que la carga incremental sea estable. Ver int_application__con_ratios.
  tope_ingresos: 900000
