# ==========================================================================
# Airflow en local con Docker Compose
# ==========================================================================
# Versión reducida del docker-compose.yaml oficial de Airflow 3.3.2:
# LocalExecutor (las tareas se ejecutan como procesos dentro del scheduler) en
# lugar de CeleryExecutor (workers + Redis), que solo compensa con varias máquinas.
#
# Uso (desde la raíz del repositorio):
#   docker compose up -d --build     # construir la imagen y arrancar
#   http://localhost:8080            # interfaz web
#   docker compose down              # parar (los volúmenes se conservan)
#
# Compose lee DATA_DIR del archivo .env de la raíz (el mismo que usa Python).

# Configuración común a todos los servicios de Airflow (ancla YAML &airflow-common;
# cada servicio la reutiliza con <<: *airflow-common).
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: orchestration/Dockerfile
  image: credit-risk-airflow:local
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # Base de datos de metadatos de Airflow (DAGs, ejecuciones, estados...)
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    # En Airflow 3 las tareas informan de su estado a través de la API
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # Secreto compartido para firmar los tokens entre componentes (solo uso local)
    # (64+ caracteres: lo mínimo recomendado para firmar con SHA-512)
    AIRFLOW__API_AUTH__JWT_SECRET: credit-risk-secreto-solo-para-uso-local-no-usar-en-produccion-0123456789
    # Sin pantalla de login: todo el que entra es administrador (solo uso local)
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # API del sistema origen (servicio api-origen): la usa la ingesta con canal=api
    ORIGEN_API_URL: http://api-origen:8000
    ORIGEN_API_KEY: &clave-api clave-solo-para-desarrollo
    # Broker de streaming (servicio redpanda): lo usa el DAG credit_risk_eventos
    KAFKA_BOOTSTRAP: redpanda:9092
    # Almacén del "banco" (lo genera credit_risk_origen; lo leen la API y el productor)
    ORIGEN_RAIZ: /opt/airflow/lake/origen
    # Base de datos operacional del banco (servicio core-bancario): la usa credit_risk_core
    CORE_DSN: postgresql://banco:banco@core-bancario:5432/core
  volumes:
    # DAGs: carpeta del repo montada en vivo (los cambios se ven sin reconstruir)
    - ./orchestration/dags:/opt/airflow/dags
    - airflow-logs:/opt/airflow/logs
    # Lago de datos de Airflow: volumen de Docker, separado de ./lake
    - lake:/opt/airflow/lake
    # Datos de Kaggle, solo lectura
    - ${DATA_DIR:?Define DATA_DIR en el archivo .env}:/data:ro
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # Se ejecuta una vez al arrancar: crea/actualiza las tablas de Airflow, crea el
  # pool "duckdb" y termina. El pool tiene 1 hueco: DuckDB solo admite un proceso
  # escribiendo, así que las tareas que lo usan se ejecutan de una en una.
  airflow-init:
    <<: *airflow-common
    command: ["pools", "set", "duckdb", "1", "DuckDB admite un solo proceso escribiendo"]
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"

  # Interfaz web y API (Airflow 3 sustituye el antiguo "webserver" por "api-server")
  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # Decide qué tareas toca ejecutar y, con LocalExecutor, las ejecuta
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # Lee los archivos de dags/ y los convierte en DAGs (en Airflow 3 es un proceso aparte)
  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # API REST del sistema origen simulado (el "banco"): sirve las entregas que el
  # DAG credit_risk_origen deja en /opt/airflow/lake/origen/<conjunto>/.
  # Documentación interactiva en http://localhost:8000/docs
  api-origen:
    build:
      context: .
      dockerfile: orchestration/Dockerfile
    image: credit-risk-airflow:local  # misma imagen: el proyecto ya está instalado en ella
    entrypoint: /opt/credit-risk/.venv/bin/uvicorn
    command: ["credit_risk.api_origen:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      ORIGEN_RAIZ: /opt/airflow/lake/origen
      ORIGEN_API_KEY: *clave-api
      # 5 % de respuestas 429/503 simuladas para que se vean los reintentos
      ORIGEN_TASA_FALLOS: "0.05"
    volumes:
      - lake:/opt/airflow/lake
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/salud"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: always

  # Redpanda: broker de streaming compatible con la API de Kafka, en un solo
  # binario (sin ZooKeeper ni JVM). Dos "listeners": redpanda:9092 para los
  # contenedores y localhost:19092 para los programas que corren en Windows.
  redpanda:
    image: redpandadata/redpanda:v26.2.4
    command:
      - redpanda start
      - --mode dev-container  # configuración pensada para desarrollo local
      - --smp 1
      - --memory 1G
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always

  # Interfaz web para ver topics, particiones, mensajes y grupos de consumidores
  redpanda-console:
    image: redpandadata/console:v3.12.0
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8082:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    restart: always

  # Consumidor de streaming: un servicio que corre siempre (no una tarea de
  # Airflow, que empieza y termina). Escribe en /opt/airflow/lake/<conjunto>/bronze.
  consumidor-stream:
    image: credit-risk-airflow:local
    entrypoint: /opt/credit-risk/.venv/bin/consume-events
    command: ["--raiz-lagos", "/opt/airflow/lake"]
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      # Sin esto, Python acumula los print en un buffer (la salida no es una
      # terminal) y `docker compose logs` no muestra nada hasta que el proceso acaba
      PYTHONUNBUFFERED: "1"
    volumes:
      - lake:/opt/airflow/lake
    depends_on:
      redpanda:
        condition: service_healthy
      api-origen:  # garantiza que la imagen ya está construida
        condition: service_started
    stop_grace_period: 30s  # tiempo para terminar el lote en curso y confirmar
    restart: always

  # Base de datos operacional SIMULADA del banco ("core bancario"): el estado vivo
  # de cada solicitud. wal_level=logical activa la replicación lógica que usa el CDC.
  core-bancario:
    image: postgres:17
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4"]
    environment:
      POSTGRES_USER: banco
      POSTGRES_PASSWORD: banco
      POSTGRES_DB: core
    volumes:
      - core-bancario-db:/var/lib/postgresql/data
      - ./orchestration/core_bancario:/docker-entrypoint-initdb.d:ro  # esquema inicial
    ports:
      - "5433:5432"  # 5433 en Windows para no chocar con un Postgres local
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "banco", "-d", "core"]
      interval: 10s
      retries: 5
    restart: always

  # Debezium Server: lee el WAL del core bancario y publica cada cambio
  # (insert/update/delete) en Redpanda, en el topic cdc.core.solicitudes.
  debezium:
    image: quay.io/debezium/server:3.7.0.Final
    volumes:
      - ./orchestration/debezium:/debezium/config:ro
      - debezium-data:/debezium/data  # posición en el WAL: sobrevive a reinicios
    depends_on:
      core-bancario:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    restart: always

  # Consumidor de CDC: servicio permanente que escribe los cambios del core
  # bancario (topic cdc.core.solicitudes) en /opt/airflow/lake/cdc/bronze.
  consumidor-cdc:
    image: credit-risk-airflow:local
    entrypoint: /opt/credit-risk/.venv/bin/consume-cdc
    command: ["--bronze", "/opt/airflow/lake/cdc/bronze"]
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      PYTHONUNBUFFERED: "1"
    volumes:
      - lake:/opt/airflow/lake
    depends_on:
      redpanda:
        condition: service_healthy
      debezium:
        condition: service_started
      api-origen:  # garantiza que la imagen ya está construida
        condition: service_started
    stop_grace_period: 30s
    restart: always

volumes:
  postgres-db:
  airflow-logs:
  lake:
  redpanda-data:
  core-bancario-db:
  debezium-data:
